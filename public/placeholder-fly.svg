<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0369a1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#grad1)"/>
  <g transform="translate(200, 150)">
    <!-- Hook shape -->
    <path d="M -30 -20 Q -30 -30 -20 -30 Q -10 -30 -10 -20 L -10 20 Q -10 30 0 30 Q 10 30 10 20" 
          stroke="white" stroke-width="3" fill="none" opacity="0.8"/>
    <!-- Fly body -->
    <ellipse cx="0" cy="-10" rx="15" ry="8" fill="white" opacity="0.9"/>
    <!-- Wings -->
    <path d="M -15 -15 Q -25 -25 -20 -30 Q -15 -25 -15 -15" 
          fill="white" opacity="0.7"/>
    <path d="M 15 -15 Q 25 -25 20 -30 Q 15 -25 15 -15" 
          fill="white" opacity="0.7"/>
  </g>
  <text x="200" y="250" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle" opacity="0.8">
    Fly Fishing
  </text>
</svg>

